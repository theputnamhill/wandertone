<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wandertone Desktop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0a1a1a; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const tealLight = "#2a9d8f";
    const tealDark  = "#0d4a4a";
    const cream     = "#f5f0e8";
    const amber     = "#e9c46a";
    const dark      = "#0a1a1a";
    const KR        = 9;

    // ── ELEMENTS ────────────────────────────────────────────────────
    const voiceKnobDefs = [
      { key:"wvfm", label:"Waveform",       desc:"Waveform selection for the voice oscillator.",                                                                                                                          knob:"normal"  },
      { key:"mint", label:"Mod Interval",   desc:"Frequency offset between the voice oscillator and its FM modulator. Clockwise raises the modulator above the voice pitch, counter-clockwise lowers it.",               knob:"bipolar" },
      { key:"mwv",  label:"Mod Waveform",   desc:"Waveform selection for the FM modulator oscillator.",                                                                                                                   knob:"normal"  },
      { key:"fm",   label:"FM Amount",       desc:"Frequency modulation amount.",                                                                                                                                         knob:"normal"  },
      { key:"env",  label:"Mod Envelope",   desc:"Degree to which the ADSR envelope influences modulator frequency. Clockwise adds positive influence, counter-clockwise inverts it.",                                     knob:"bipolar" },
      { key:"hyp",  label:"Hypermodulation",desc:"Frequency hypermodulation amount.",                                                                                                                                     knob:"normal"  },
      { key:"port", label:"Portamento",      desc:"Portamento. Also governs how fast Drift gathers and disperses.",                                                                                                        knob:"normal"  },
      { key:"flut", label:"Flutter Amount", desc:"Degree to which the Flutter LFO modulates the voice and modulator frequency.",                                                                                           knob:"normal"  },
      { key:"vol",  label:"Volume",          desc:"Individual voice volume.",                                                                                                                                              knob:"normal"  },
    ];

    const elements = {};
    [1,2,3].forEach(v => voiceKnobDefs.forEach(({key,label,desc,knob}) => {
      elements[`v${v}_${key}`] = { label:`Voice — ${label}`, desc, knob, voice:v };
    }));
    Object.assign(elements, {
      fold_amt:  { label:"Fold — Amount",                   desc:"Dry/wet balance for the wavefolder.",                                                                                                                    knob:"normal"  },
      fold_lfo1: { label:"Fold — WF1 LFO Rate",             desc:"Wavefolder 1 LFO rate.",                                                                                                                                knob:"normal"  },
      fold_lfo2: { label:"Fold — WF2 LFO Rate",             desc:"Wavefolder 2 LFO rate.",                                                                                                                                knob:"normal"  },
      fold_lfo3: { label:"Fold — WF3 LFO Rate",             desc:"Wavefolder 3 LFO rate.",                                                                                                                                knob:"normal"  },
      flut_filt: { label:"Flutter — Filter Cutoff Mod",     desc:"Filter cutoff modulation amount from the Flutter LFO.",                                                                                                  knob:"normal"  },
      flut_rate: { label:"Flutter — Rate",                  desc:"Flutter LFO rate.",                                                                                                                                      knob:"normal"  },
      filt_env:  { label:"Filter — Envelope",               desc:"Degree to which the ADSR envelope affects filter cutoff. Clockwise for positive influence, counter-clockwise for full inversion.",                       knob:"bipolar" },
      filt_q:    { label:"Filter — Q (Resonance)",          desc:"Filter resonance.",                                                                                                                                      knob:"normal"  },
      filt_cut:  { label:"Filter — Cutoff",                 desc:"Base cutoff frequency for the 2-pole state variable filter.",                                                                                             knob:"normal"  },
      filt_trk:  { label:"Filter — Tracking",               desc:"Degree to which the filter cutoff follows (or inversely follows) the pitch of the note. Clockwise for positive tracking, counter-clockwise for inverse.", knob:"bipolar" },
      adsr_atk:  { label:"ADSR — Attack",                   desc:"Rate of rise of the envelope upon key press.",                                                                                                            knob:"normal"  },
      adsr_dec:  { label:"ADSR — Decay",                    desc:"Rate of fall while the key is held down.",                                                                                                               knob:"normal"  },
      adsr_sus:  { label:"ADSR — Sustain",                  desc:"Level at which the envelope is held while the key is still held.",                                                                                       knob:"normal"  },
      adsr_rel:  { label:"ADSR — Release",                  desc:"Rate of final descent of the envelope upon releasing the key.",                                                                                          knob:"normal"  },
      drift_en:  { label:"Drift — Enable",                  desc:"Toggle Drift on/off. On press each voice starts at a random pitch and glides to target (Gather). On release voices disperse to a random final pitch.",   knob:null      },
      drift_rng: { label:"Drift — Range",                   desc:"Range of possible random notes for Drift.",                                                                                                               knob:"normal"  },
      drift_ctr: { label:"Drift — Tonal Center",            desc:"Tonal center of the Drift range. Clockwise shifts the range up, counter-clockwise shifts it down.",                                                      knob:"bipolar" },
      drift_mode:{ label:"Drift — Mode",                    desc:"Up: Disperse only. Middle: Gather + Disperse. Down: Gather only.",                                                                                        knob:null      },
      fx_eq:     { label:"FX — Master EQ",                  desc:"Continuously changes the filter from lowpass to highpass as turned clockwise.",                                                                          knob:"bipolar" },
      fx_drive:  { label:"FX — Overdrive",                  desc:"Overdrive amount.",                                                                                                                                      knob:"normal"  },
      fx_dmix:   { label:"FX — Delay Mix",                  desc:"Analog delay wet/dry mix.",                                                                                                                              knob:"normal"  },
      fx_dtime:  { label:"FX — Delay Time",                 desc:"Analog delay time: 5 ms - 200 ms.",                                                                                                                     knob:"normal"  },
      util_pwr:  { label:"Utils — Power",                   desc:"Power on/off.",                                                                                                                                          knob:null      },
      util_exp:  { label:"Utils — Expression Pedal Assign", desc:"Select envelope decay, portamento, overall flutter intensity, or filter cutoff to be influenced by the expression pedal.",                               knob:"normal"  },
      util_vol:  { label:"Utils — Master Volume",           desc:"Master output volume.",                                                                                                                                  knob:"normal"  },
      btn_light: { label:"Buttons — Light Switch",          desc:"Toggles illumination of the button LEDs.",                                                                                                               knob:null      },
      btn_oct1:  { label:"Buttons — Octave +1",             desc:"Adds one octave to pitch.",                                                                                                                              knob:null      },
      btn_oct2:  { label:"Buttons — Octave +2",             desc:"Adds 2 octaves to pitch. Pressing both +1 and +2 at the same time raises pitch by 3 octaves.",                                                          knob:null      },
      btn_octR:  { label:"Buttons — Octave Reverse",        desc:"Lowers pitch by the interval specified by the Octave +1 and +2 state.",                                                                                  knob:null      },
      btn_latch: { label:"Buttons — Octave Latch",          desc:"Freezes the octave specified by the preceding choices.",                                                                                                  knob:null      },
      btn_trim:  { label:"Buttons — Voice Trims",           desc:"Micro adjustment to pitch of voices 1, 2, and 3.",                                                                                                       knob:null      },
      btn_keys:  { label:"Buttons — Chromatic Keys",        desc:"1-octave chromatic pitch controller.",                                                                                                                   knob:null      },
    });

    // ── HIGHLIGHTS ──────────────────────────────────────────────────
    const sectionAffects = { fx_eq:["FILTER"], filt_env:["ADSR"] };
    [1,2,3].forEach(v => {
      sectionAffects[`v${v}_env`]  = ["ADSR"];
      sectionAffects[`v${v}_port`] = ["DRIFT"];
    });

    const knobAffects = {};
    [1,2,3].forEach(v => {
      knobAffects[`v${v}_fm`]   = [`v${v}_mint`,`v${v}_mwv`,`v${v}_env`,`v${v}_hyp`];
      knobAffects[`v${v}_flut`] = ["flut_rate"];
    });
    ["adsr_atk","adsr_dec","adsr_sus","adsr_rel"].forEach(id => {
      knobAffects[id] = ["v1_env","v2_env","v3_env","filt_env"];
    });
    ["drift_en","drift_rng","drift_ctr","drift_mode"].forEach(id => {
      knobAffects[id] = ["v1_port","v2_port","v3_port"];
    });
    knobAffects.flut_rate = ["v1_flut","v2_flut","v3_flut","flut_filt"];
    knobAffects.flut_filt = ["filt_cut"];
    knobAffects.filt_trk  = ["filt_cut"];
    knobAffects.fx_dmix   = ["fx_dtime"];
    knobAffects.fold_amt  = ["fold_lfo1","fold_lfo2","fold_lfo3"];
    knobAffects.util_exp  = ["adsr_dec","v1_port","v2_port","v3_port","flut_rate","filt_cut"];

    // ── COMPONENTS ──────────────────────────────────────────────────
    function Knob({ id, cx, cy, label, active, onClick, bipolar, biDir, highlight }) {
      const c = active ? amber : highlight ? "rgba(233,196,106,0.9)" : tealLight;
      const r = KR - 2;
      let tipX, tipY;
      if (bipolar) {
        tipX = active ? cx + biDir*0.866*r : cx;
        tipY = active ? cy - 0.5*r         : cy - r;
      } else {
        tipX = active ? cx - r       : cx - 0.5*r;
        tipY = active ? cy           : cy + 0.866*r;
      }
      return (
        <g onClick={() => onClick(id)} style={{ cursor:"pointer" }}>
          <circle cx={cx} cy={cy} r={KR+7} fill="transparent" />
          <circle cx={cx} cy={cy} r={KR} fill="#0d2a2a" stroke={c} strokeWidth={active ? 2 : highlight ? 1.8 : 1.2} />
          {highlight && !active && (
            <circle cx={cx} cy={cy} r={KR+3} fill="none" stroke="rgba(233,196,106,0.35)" strokeWidth={1.2} />
          )}
          <line x1={cx} y1={cy} x2={tipX} y2={tipY} stroke={cream} strokeWidth={1.5} strokeLinecap="round" />
          {label && (
            <text x={cx} y={cy+KR+8} textAnchor="middle"
              fill={active ? amber : highlight ? "rgba(233,196,106,0.9)" : "#4a8a84"} fontSize={5} fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function Toggle({ id, cx, cy, label, active, onClick, highlight }) {
      return (
        <g onClick={() => onClick(id)} style={{ cursor:"pointer" }}>
          <rect x={cx-9} y={cy-14} width={18} height={28} fill="transparent" />
          <rect x={cx-5} y={cy-10} width={10} height={20} rx={3}
            fill="#071010"
            stroke={active ? amber : highlight ? "rgba(233,196,106,0.9)" : tealLight}
            strokeWidth={active ? 2 : highlight ? 1.8 : 1.2} />
          <circle cx={cx} cy={active ? cy-4 : cy+4} r={3.5} fill={active ? amber : tealLight} opacity={0.9} />
          {label && (
            <text x={cx} y={cy+16} textAnchor="middle"
              fill={active ? amber : highlight ? "rgba(233,196,106,0.9)" : "#4a8a84"} fontSize={5} fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function SqBtn({ id, cx, cy, w=18, h=18, label, active, onClick }) {
      return (
        <g onClick={() => onClick(id)} style={{ cursor:"pointer" }}>
          <rect x={cx-w/2-5} y={cy-h/2-5} width={w+10} height={h+10} fill="transparent" />
          <rect x={cx-w/2} y={cy-h/2} width={w} height={h} rx={3}
            fill={active ? tealDark : "#071010"} stroke={active ? amber : tealLight}
            strokeWidth={active ? 2 : 1.2} />
          {label && (
            <text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle"
              fill={active ? amber : cream} fontSize={6.5} fontWeight="bold" fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function PanelBox({ x, y, w, h, label, highlight }) {
      return (
        <g>
          <rect x={x} y={y} width={w} height={h} rx={5}
            fill="rgba(13,42,42,0.65)" stroke="rgba(42,157,143,0.3)" strokeWidth={1} />
          {highlight && (
            <rect x={x} y={y} width={w} height={h} rx={5}
              fill="rgba(233,196,106,0.08)" stroke="rgba(233,196,106,0.9)" strokeWidth={1.5} />
          )}
          {label && (
            <text x={x+w/2} y={y+9} textAnchor="middle"
              fill={amber} fontSize={6} fontFamily="monospace" letterSpacing={0.8}>{label}</text>
          )}
        </g>
      );
    }

    // ── LAYOUT CONSTANTS ────────────────────────────────────────────
    // viewBox: 488 × 434. Container width: 600px. Scale ≈ 1.23×.
    // Knob radius 9 renders at ~11px — same feel as mobile.
    const VBW = 488, VBH = 434;
    const M = 8, GAP = 8;
    const VW = 152; // voice col width (same as mobile)
    // Col x positions
    const CX = [M, M+VW+GAP, M+2*(VW+GAP)]; // [8, 168, 328]
    // Row definitions
    const R = {
      voice: { y:8,   h:110 },
      fold:  { y:126, h:52  },
      mid:   { y:186, h:58  }, // Filter / Flutter / ADSR
      bot:   { y:252, h:58  }, // Drift  / Flutter / FX
      utl:   { y:318, h:48  },
      btn:   { y:374, h:52  },
    };
    // Flutter spans mid+gap+bot vertically in center col
    const FLUT_Y = R.mid.y, FLUT_H = R.mid.h + GAP + R.bot.h; // 124
    const FOLD_W = VBW - 2*M; // 472

    function kcy(y,h,rows=1,row=0) {
      const slotH = (h-12)/rows;
      return Math.round(y + 12 + slotH*(row+0.5) - 4);
    }
    function tcyf(y,h) { return Math.round(y + 12 + (h-12)/2 - 3); }
    function evenCols(x,w,n) { return Array.from({length:n},(_,i) => Math.round(x + w/n*(i+0.5))); }

    // ── FULL PANEL ──────────────────────────────────────────────────
    function FullPanel({ active, biDir, onClick }) {
      const a       = id => active === id;
      const bi      = id => elements[id] && elements[id].knob === "bipolar";
      const lit     = new Set(active ? (sectionAffects[active] || []) : []);
      const knobLit = new Set(active ? (knobAffects[active]    || []) : []);
      const hl      = name => lit.has(name);
      const khl     = id   => knobLit.has(id);
      const K       = (id, cx, cy, lbl) => (
        <Knob key={id} id={id} cx={cx} cy={cy} label={lbl}
          active={a(id)} bipolar={bi(id)} biDir={biDir} highlight={khl(id)} onClick={onClick} />
      );

      // Voice row/col positions
      const vRows = [0,1,2].map(i => {
        const slotH = (R.voice.h-12)/3;
        return Math.round(R.voice.y + 12 + slotH*(i+0.5) - 4);
      });
      const vKeys = [["wvfm","mint","mwv"],["fm","env","hyp"],["port","flut","vol"]];
      const vLbls = [["WVFM","M-INT\u00b1","M-WV"],["FM","ENV\u00b1","HYP"],["PORT","FLUT","VOL"]];

      // Fold: 4 knobs centered between V1 vol (cx≈135) and V3 port (cx≈353)
      const foldCY   = kcy(R.fold.y, R.fold.h);
      const foldCols = [162, 217, 271, 326]; // AMT, WF1, WF2, WF3

      // Flutter: box inset 6px from each neighbor, 10% wider than before
      const FLUT_X = 223, FLUT_W = 42; // gap=6px each side
      const flutCX  = FLUT_X + FLUT_W/2; // 244
      const flutCY1 = kcy(FLUT_Y, FLUT_H, 2, 0);
      const flutCY2 = kcy(FLUT_Y, FLUT_H, 2, 1);

      // Filter/Drift: x=8, width = WF1 cx - 8 = 209
      const FIL_X = 8, FIL_W = 209;
      const filCY    = kcy(R.mid.y, R.mid.h);
      const filCols  = [34, 86, 139, 191]; // 4 evenly in 209
      const driftCY  = tcyf(R.bot.y, R.bot.h);
      const driftCols = filCols;

      // ADSR/FX: x=WF2 cx (271), width = 480-271 = 209
      const ADSR_X = 271, ADSR_W = 209;
      const adsrCY   = kcy(R.mid.y, R.mid.h);
      const adsrCols = [297, 349, 402, 454]; // 4 evenly in 209
      const fxCY     = kcy(R.bot.y, R.bot.h);
      const fxCols   = adsrCols;

      // Utils
      const utlCY = kcy(R.utl.y, R.utl.h);

      // Buttons: left box x=8 w=232, right box x=248 w=232
      const BTN_LW = 232, BTN_RW = 232;
      const btnCY  = Math.round(R.btn.y + R.btn.h/2);
      // Left box half = 8+116=124. Elements (light,+1,+2,↓,latch) in left half (8..124), 5 items
      // Trims centered at 3/4 point = 8+174 = 182
      const btnEls = [30, 53, 76, 99, 122]; // light, oct1, oct2, octR, latch — shifted right
      const trimCX = 213; // mirrors light button distance from left edge
      // Chromatic keys: box x=248 w=232. 7 white keys w=15 gap=2 → total=117. Start=248+(232-117)/2=305.5→306
      const keysStartX = 306;

      return (
        <svg width="100%" viewBox={`0 0 ${VBW} ${VBH}`} style={{ display:"block" }}>
          <rect x={1} y={1} width={VBW-2} height={VBH-2} rx={9}
            fill="#081818" stroke="rgba(42,157,143,0.25)" strokeWidth={1} />

          {/* ── VOICES ── */}
          {[1,2,3].map((v,i) => (
            <g key={v}>
              <PanelBox x={CX[i]} y={R.voice.y} w={VW} h={R.voice.h}
                label={`VOICE ${["I","II","III"][i]}`} />
              {vKeys.map((row,ri) => row.map((key,ki) => {
                const id = `v${v}_${key}`;
                const cx = Math.round(CX[i] + VW/3*(ki+0.5));
                const cy = vRows[ri];
                return <Knob key={id} id={id} cx={cx} cy={cy} label={vLbls[ri][ki]}
                  active={a(id)} bipolar={bi(id)} biDir={biDir} highlight={khl(id)} onClick={onClick} />;
              }))}
            </g>
          ))}

          {/* ── FOLD ── */}
          <PanelBox x={M} y={R.fold.y} w={FOLD_W} h={R.fold.h} label="FOLD" highlight={hl("FOLD")} />
          {K("fold_amt",  foldCols[0], foldCY, "AMT")}
          {K("fold_lfo1", foldCols[1], foldCY, "WF1")}
          {K("fold_lfo2", foldCols[2], foldCY, "WF2")}
          {K("fold_lfo3", foldCols[3], foldCY, "WF3")}

          {/* ── FILTER ── x=8 w=209 */}
          <PanelBox x={FIL_X} y={R.mid.y} w={FIL_W} h={R.mid.h} label="FILTER" highlight={hl("FILTER")} />
          {K("filt_env", filCols[0], filCY, "ENV\u00b1")}
          {K("filt_q",   filCols[1], filCY, "Q")}
          {K("filt_cut", filCols[2], filCY, "CUT")}
          {K("filt_trk", filCols[3], filCY, "TRK\u00b1")}

          {/* ── FLUTTER x=217 w=54, vertical ── */}
          <PanelBox x={FLUT_X} y={FLUT_Y} w={FLUT_W} h={FLUT_H} label="FLUTTER" highlight={hl("FLUTTER")} />
          {K("flut_filt", flutCX, flutCY1, "FILT-MOD")}
          {K("flut_rate", flutCX, flutCY2, "RATE")}

          {/* ── ADSR x=271 w=209 ── */}
          <PanelBox x={ADSR_X} y={R.mid.y} w={ADSR_W} h={R.mid.h} label="ADSR" highlight={hl("ADSR")} />
          {K("adsr_atk", adsrCols[0], adsrCY, "ATK")}
          {K("adsr_dec", adsrCols[1], adsrCY, "DEC")}
          {K("adsr_sus", adsrCols[2], adsrCY, "SUS")}
          {K("adsr_rel", adsrCols[3], adsrCY, "REL")}

          {/* ── DRIFT x=8 w=209 ── */}
          <PanelBox x={FIL_X} y={R.bot.y} w={FIL_W} h={R.bot.h} label="DRIFT" highlight={hl("DRIFT")} />
          <Toggle id="drift_en"   cx={driftCols[0]} cy={driftCY} label="EN"   active={a("drift_en")}   highlight={khl("drift_en")}   onClick={onClick} />
          {K("drift_rng", driftCols[1], driftCY, "RANGE")}
          {K("drift_ctr", driftCols[2], driftCY, "CENT\u00b1")}
          <Toggle id="drift_mode" cx={driftCols[3]} cy={driftCY} label="MODE" active={a("drift_mode")} highlight={khl("drift_mode")} onClick={onClick} />

          {/* ── FX x=271 w=209 ── */}
          <PanelBox x={ADSR_X} y={R.bot.y} w={ADSR_W} h={R.bot.h} label="FX" highlight={hl("FX")} />
          {K("fx_eq",    fxCols[0], fxCY, "EQ\u00b1")}
          {K("fx_drive", fxCols[1], fxCY, "DRIVE")}
          {K("fx_dmix",  fxCols[2], fxCY, "D-MIX")}
          {K("fx_dtime", fxCols[3], fxCY, "D-TIME")}

          {/* ── UTILS ── */}
          <PanelBox x={M} y={R.utl.y} w={FOLD_W} h={R.utl.h} label="UTILS" highlight={hl("UTILS")} />
          <g onClick={() => onClick("util_pwr")} style={{ cursor:"pointer" }}>
            <rect x={22} y={utlCY-9} width={18} height={18} rx={3}
              fill={a("util_pwr") ? tealDark : "#071010"}
              stroke={a("util_pwr") ? amber : "#d04040"} strokeWidth={a("util_pwr") ? 2 : 1.2} />
            <text x={31} y={utlCY} textAnchor="middle" dominantBaseline="middle"
              fill={a("util_pwr") ? amber : "#d04040"} fontSize={10} fontFamily="monospace">&#x23FB;</text>
            <text x={31} y={utlCY+15} textAnchor="middle"
              fill={a("util_pwr") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">PWR</text>
          </g>
          {K("util_exp", Math.round(VBW/2), utlCY, "EXP-SEL")}
          {K("util_vol", VBW-M-22,          utlCY, "M-VOL")}

          {/* ── LEFT BUTTONBOARD ── */}
          <PanelBox x={M} y={R.btn.y} w={BTN_LW} h={R.btn.h} label="LEFT BUTTONBOARD" />
          {/* light, +1, +2, ↓, latch centered in left half (x=8..124). cx at 20,43,66,89,112 */}
          <g onClick={() => onClick("btn_light")} style={{ cursor:"pointer" }}>
            <rect x={btnEls[0]-6.5} y={btnCY-6.5} width={13} height={13} rx={2}
              fill={a("btn_light") ? amber : "#071010"}
              stroke={a("btn_light") ? amber : tealLight} strokeWidth={1.2} />
            <text x={btnEls[0]} y={btnCY+13} textAnchor="middle"
              fill={a("btn_light") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">LIGHT</text>
          </g>
          <SqBtn id="btn_oct1" cx={btnEls[1]} cy={btnCY} w={18} h={18} label="+1"        active={a("btn_oct1")} onClick={onClick} />
          <SqBtn id="btn_oct2" cx={btnEls[2]} cy={btnCY} w={18} h={18} label="+2"        active={a("btn_oct2")} onClick={onClick} />
          <SqBtn id="btn_octR" cx={btnEls[3]} cy={btnCY} w={18} h={18} label="&#x2193;" active={a("btn_octR")} onClick={onClick} />
          {/* Latch circle */}
          <g onClick={() => onClick("btn_latch")} style={{ cursor:"pointer" }}>
            <circle cx={btnEls[4]} cy={btnCY} r={KR+5} fill="transparent" />
            <circle cx={btnEls[4]} cy={btnCY} r={KR} fill={a("btn_latch") ? tealDark : "#071010"}
              stroke={a("btn_latch") ? amber : tealLight} strokeWidth={a("btn_latch") ? 2 : 1.2} />
            <text x={btnEls[4]} y={btnCY} textAnchor="middle" dominantBaseline="middle"
              fill={a("btn_latch") ? amber : cream} fontSize={4.5} fontFamily="monospace">LCH</text>
            <text x={btnEls[4]} y={btnCY+15} textAnchor="middle"
              fill={a("btn_latch") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">LATCH</text>
          </g>
          {/* Trims centered at 3/4 of box (cx=182) */}
          <g onClick={() => onClick("btn_trim")} style={{ cursor:"pointer" }}>
            <rect x={trimCX-16} y={btnCY-10} width={32} height={20} fill="transparent" />
            {[trimCX-8, trimCX, trimCX+8].map((tx,i) => (
              <circle key={i} cx={tx} cy={btnCY} r={3.5}
                fill="#071010" stroke={a("btn_trim") ? amber : "#4a8a84"} strokeWidth={1.2} />
            ))}
            <text x={trimCX} y={btnCY+15} textAnchor="middle"
              fill={a("btn_trim") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">TRIMS</text>
          </g>

          {/* ── CHROMATIC KEYS — centered in box x=248 w=232 ── */}
          <PanelBox x={M+BTN_LW+GAP} y={R.btn.y} w={BTN_RW} h={R.btn.h} label="CHROMATIC KEYS" />
          <g onClick={() => onClick("btn_keys")} style={{ cursor:"pointer" }}>
            {[0,1,2,3,4,5,6].map(i => (
              <rect key={i} x={keysStartX+i*17} y={R.btn.y+14} width={15} height={28} rx={2}
                fill={a("btn_keys") ? "#c8d8d0" : "#ccc8bc"} stroke="#0a1a1a" strokeWidth={0.8} />
            ))}
            {[0.5,1.5,3.5,4.5,5.5].map((pos,i) => (
              <rect key={i} x={keysStartX+pos*17+3} y={R.btn.y+14} width={11} height={17} rx={2}
                fill={a("btn_keys") ? "#1a6b6b" : "#0d2a2a"}
                stroke={a("btn_keys") ? amber : tealLight} strokeWidth={0.8} />
            ))}
            <text x={248+BTN_RW/2} y={R.btn.y+R.btn.h-4} textAnchor="middle"
              fill={a("btn_keys") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">1 OCT RANGE</text>
          </g>
        </svg>
      );
    }

    // ── APP ─────────────────────────────────────────────────────────
    function WandertoneDesktop() {
      const [active, setActive]     = useState(null);
      const [biDir, setBiDir]       = useState(1);
      const [showFlow, setShowFlow] = useState(false);

      const toggle = id => {
        setShowFlow(false);
        const next = active === id ? null : id;
        if (next && elements[next] && elements[next].knob === "bipolar") {
          setBiDir(Math.random() < 0.5 ? 1 : -1);
        }
        setActive(next);
      };

      const handleBubbleClick = () => {
        setActive(null);
        setShowFlow(prev => !prev);
      };

      const info = active ? elements[active] : null;

      return (
        <div style={{
          background: dark, minHeight: "100vh",
          fontFamily: "'Courier New', monospace", color: cream,
          display: "flex", flexDirection: "column", alignItems: "center",
          padding: "0 0 20px",
        }}>
          {/* All content locked to panel width */}
          <div style={{ width: 700 }}>
            {/* Header */}
            <div style={{ padding:"12px 10px 0" }}>
              <span style={{
                fontFamily:"'Franklin Gothic Heavy','Arial Narrow','Impact','Arial Black',sans-serif",
                fontWeight:900, fontSize:26, letterSpacing:2, color:cream, textTransform:"uppercase",
              }}>WANDERTONE</span>
            </div>

            {/* Info bubble — locked to same width as panel */}
            <div onClick={handleBubbleClick} style={{
              margin:"10px 10px 0", height:96,
              background:(info || showFlow) ? tealDark : "rgba(13,42,42,0.35)",
              border:`1px solid ${(info || showFlow) ? amber : "rgba(42,157,143,0.18)"}`,
              borderRadius:9, padding:"0 14px", boxSizing:"border-box",
              display:"flex", flexDirection:"column", justifyContent:"center",
              transition:"border-color 0.15s, background 0.15s",
              overflow:"hidden", cursor:"pointer",
            }}>
              {showFlow ? (
                <svg width="100%" viewBox="0 0 380 64" style={{ display:"block", maxWidth:380, margin:"0 auto" }}>
                  <text x={190} y={9} textAnchor="middle" fill={amber} fontSize={5.5} fontFamily="monospace" letterSpacing={0.8}>SIGNAL FLOW</text>
                  {[
                    { lbl:"VOICES \u00d73", x:20  },
                    { lbl:"FOLD",           x:90  },
                    { lbl:"FILTER",         x:160 },
                    { lbl:"DELAY",          x:230 },
                    { lbl:"OUT",            x:300 },
                  ].map(({ lbl, x }, i, arr) => (
                    <g key={lbl}>
                      <rect x={x} y={13} width={56} height={14} rx={3} fill="#0a2222" stroke={tealLight} strokeWidth={0.8} />
                      <text x={x+28} y={20} textAnchor="middle" dominantBaseline="middle"
                        fill={cream} fontSize={5} fontFamily="monospace">{lbl}</text>
                      {i < arr.length-1 && <>
                        <line x1={x+56} y1={20} x2={x+68} y2={20} stroke={tealLight} strokeWidth={0.8} />
                        <polygon points={`${x+70},20 ${x+66},18.5 ${x+66},21.5`} fill={tealLight} />
                      </>}
                    </g>
                  ))}
                  <rect x={38} y={38} width={44} height={12} rx={3} fill="#0a2222" stroke="#4a8a84" strokeWidth={0.7} />
                  <text x={60} y={44} textAnchor="middle" dominantBaseline="middle" fill="#6ab5af" fontSize={4.5} fontFamily="monospace">FLUTTER/DRIFT</text>
                  <line x1={60} y1={38} x2={60} y2={33} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                  <line x1={60} y1={33} x2={60} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                  <polygon points="60,27 58.5,30 61.5,30" fill="#4a8a84" />
                  <line x1={60} y1={33} x2={188} y2={33} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                  <line x1={188} y1={33} x2={188} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                  <polygon points="188,27 186.5,30 189.5,30" fill="#4a8a84" />
                  <rect x={160} y={38} width={44} height={12} rx={3} fill="#0a2222" stroke="#4a8a84" strokeWidth={0.7} />
                  <text x={182} y={44} textAnchor="middle" dominantBaseline="middle" fill="#6ab5af" fontSize={4.5} fontFamily="monospace">ADSR ENV</text>
                  <line x1={188} y1={38} x2={188} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                  <polygon points="188,27 186.5,30 189.5,30" fill="#4a8a84" />
                </svg>
              ) : info ? (
                <>
                  <div style={{ color:amber, fontWeight:700, fontSize:12, marginBottom:3, letterSpacing:0.3 }}>
                    {info.label}
                    {info.knob === "bipolar" && (
                      <span style={{
                        marginLeft:8, fontSize:9, fontWeight:400, color:tealLight,
                        border:`1px solid ${tealLight}`, borderRadius:3,
                        padding:"1px 4px", verticalAlign:"middle",
                      }}>&#xb1; BIPOLAR</span>
                    )}
                  </div>
                  <div style={{
                    color:"#a8d5d0", fontSize:11, lineHeight:1.45,
                    display:"-webkit-box", WebkitLineClamp:3,
                    WebkitBoxOrient:"vertical", overflow:"hidden",
                  }}>{info.desc}</div>
                </>
              ) : (
                <div style={{ color:"rgba(42,157,143,0.3)", fontSize:10, letterSpacing:0.4, textAlign:"center" }}>
                  tap any control
                </div>
              )}
            </div>

            {/* Panel */}
            <div style={{ padding:"14px 10px 4px" }}>
              <FullPanel active={active} biDir={biDir} onClick={toggle} />
            </div>

            {/* Legend — centered below diagram */}
            <div style={{
              margin:"4px 10px 16px",
              display:"flex", justifyContent:"center", alignItems:"center", gap:16,
              fontSize:9, color:"#4a8a84", fontFamily:"'Courier New', monospace",
            }}>
              <span style={{ display:"flex", alignItems:"center", gap:4 }}>
                <svg width={14} height={14} viewBox="0 0 14 14">
                  <circle cx={7} cy={7} r={6} fill="#0d2a2a" stroke={tealLight} strokeWidth={1} />
                  <line x1={7} y1={7} x2={4.5} y2={10.5} stroke={cream} strokeWidth={1.2} strokeLinecap="round" />
                </svg>
                normal (CCW = off)
              </span>
              <span style={{ display:"flex", alignItems:"center", gap:4 }}>
                <svg width={14} height={14} viewBox="0 0 14 14">
                  <circle cx={7} cy={7} r={6} fill="#0d2a2a" stroke={tealLight} strokeWidth={1} />
                  <line x1={7} y1={7} x2={7} y2={2} stroke={cream} strokeWidth={1.2} strokeLinecap="round" />
                </svg>
                &#xb1; bipolar (12 o&#x27;clock = off)
              </span>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<WandertoneDesktop />);
  </script>
</body>
</html>

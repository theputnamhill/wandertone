<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wandertone</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a1a1a; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const tealLight = "#2a9d8f";
    const tealDark  = "#0d4a4a";
    const cream     = "#f5f0e8";
    const amber     = "#e9c46a";
    const dark      = "#0a1a1a";

    const elements = {
      v_wvfm:    { label: "Voice — Waveform",              desc: "Waveform selection for the voice oscillator.",                                                                                                                              knob: "normal"  },
      v_mint:    { label: "Voice — Mod Interval",           desc: "Frequency offset between the voice oscillator and its FM modulator. Clockwise raises the modulator above the voice pitch, counter-clockwise lowers it.",                  knob: "bipolar" },
      v_mwv:     { label: "Voice — Mod Waveform",           desc: "Waveform selection for the FM modulator oscillator.",                                                                                                                       knob: "normal"  },
      v_fm:      { label: "Voice — FM Amount",               desc: "Frequency modulation amount.",                                                                                                                                             knob: "normal"  },
      v_env:     { label: "Voice — Mod Envelope",           desc: "Degree to which the ADSR envelope influences modulator frequency. Clockwise adds positive influence, counter-clockwise inverts it.",                                        knob: "bipolar" },
      v_hyp:     { label: "Voice — Hypermodulation",        desc: "Frequency hypermodulation amount.",                                                                                                                                         knob: "normal"  },
      v_port:    { label: "Voice — Portamento",              desc: "Portamento. Also governs how fast Drift gathers and disperses.",                                                                                                            knob: "normal"  },
      v_flut:    { label: "Voice — Flutter Amount",          desc: "Degree to which the Flutter LFO modulates the voice and modulator frequency.",                                                                                             knob: "normal"  },
      v_vol:     { label: "Voice — Volume",                  desc: "Individual voice volume.",                                                                                                                                                 knob: "normal"  },
      fold_amt:  { label: "Fold — Amount",                   desc: "Dry/wet balance for the wavefolder.",                                                                                                                                      knob: "normal"  },
      fold_lfo1: { label: "Fold — WF1 LFO Rate",             desc: "Wavefolder 1 LFO rate.",                                                                                                                                                  knob: "normal"  },
      fold_lfo2: { label: "Fold — WF2 LFO Rate",             desc: "Wavefolder 2 LFO rate.",                                                                                                                                                  knob: "normal"  },
      fold_lfo3: { label: "Fold — WF3 LFO Rate",             desc: "Wavefolder 3 LFO rate.",                                                                                                                                                  knob: "normal"  },
      flut_filt: { label: "Flutter — Filter Cutoff Mod",    desc: "Filter cutoff modulation amount from the Flutter LFO.",                                                                                                                     knob: "normal"  },
      flut_rate: { label: "Flutter — Rate",                  desc: "Flutter LFO rate.",                                                                                                                                                        knob: "normal"  },
      filt_env:  { label: "Filter — Envelope",               desc: "Degree to which the ADSR envelope affects filter cutoff. Clockwise for positive influence, counter-clockwise for full inversion.",                                         knob: "bipolar" },
      filt_q:    { label: "Filter — Q (Resonance)",          desc: "Filter resonance.",                                                                                                                                                        knob: "normal"  },
      filt_cut:  { label: "Filter — Cutoff",                 desc: "Base cutoff frequency for the 2-pole state variable filter.",                                                                                                              knob: "normal"  },
      filt_trk:  { label: "Filter — Tracking",               desc: "Degree to which the filter cutoff follows (or inversely follows) the pitch of the note. Clockwise for positive tracking, counter-clockwise for inverse.",                 knob: "bipolar" },
      adsr_atk:  { label: "ADSR — Attack",                   desc: "Rate of rise of the envelope upon key press.",                                                                                                                             knob: "normal"  },
      adsr_dec:  { label: "ADSR — Decay",                    desc: "Rate of fall while the key is held down.",                                                                                                                                 knob: "normal"  },
      adsr_sus:  { label: "ADSR — Sustain",                  desc: "Level at which the envelope is held while the key is still held.",                                                                                                         knob: "normal"  },
      adsr_rel:  { label: "ADSR — Release",                  desc: "Rate of final descent of the envelope upon releasing the key.",                                                                                                            knob: "normal"  },
      drift_en:  { label: "Drift — Enable",                  desc: "Toggle Drift on/off. On press each voice starts at a random pitch and glides to target (Gather). On release voices disperse to a random final pitch.",                    knob: null      },
      drift_rng: { label: "Drift — Range",                   desc: "Range of possible random notes for Drift.",                                                                                                                                knob: "normal"  },
      drift_ctr: { label: "Drift — Tonal Center",            desc: "Tonal center of the Drift range. Clockwise shifts the range up, counter-clockwise shifts it down.",                                                                       knob: "bipolar" },
      drift_mode:{ label: "Drift — Mode",                    desc: "Up: Disperse only. Middle: Gather + Disperse. Down: Gather only.",                                                                                                         knob: null      },
      fx_eq:     { label: "FX — Master EQ",                  desc: "Continuously changes the filter from lowpass to highpass as turned clockwise.",                                                                                            knob: "bipolar" },
      fx_drive:  { label: "FX — Overdrive",                  desc: "Overdrive amount.",                                                                                                                                                        knob: "normal"  },
      fx_dmix:   { label: "FX — Delay Mix",                  desc: "Analog delay wet/dry mix.",                                                                                                                                                knob: "normal"  },
      fx_dtime:  { label: "FX — Delay Time",                 desc: "Analog delay time: 5 ms – 200 ms.",                                                                                                                                        knob: "normal"  },
      util_pwr:  { label: "Utils — Power",                   desc: "Power on/off.",                                                                                                                                                            knob: null      },
      util_exp:  { label: "Utils — Expression Pedal Assign", desc: "Select envelope decay, portamento, overall flutter intensity, or filter cutoff to be influenced by the expression pedal.",                                                 knob: "normal"  },
      util_vol:  { label: "Utils — Master Volume",           desc: "Master output volume.",                                                                                                                                                    knob: "normal"  },
      btn_light: { label: "Buttons — Light Switch",          desc: "Toggles illumination of the button LEDs.",                                                                                                                                 knob: null      },
      btn_oct1:  { label: "Buttons — Octave +1",             desc: "Adds one octave to pitch.",                                                                                                                                               knob: null      },
      btn_oct2:  { label: "Buttons — Octave +2",             desc: "Adds 2 octaves to pitch. Pressing both +1 and +2 at the same time raises pitch by 3 octaves.",                                                                            knob: null      },
      btn_octR:  { label: "Buttons — Octave Reverse",        desc: "Lowers pitch by the interval specified by the Octave +1 and +2 state.",                                                                                                   knob: null      },
      btn_latch: { label: "Buttons — Octave Latch",          desc: "Freezes the octave specified by the preceding choices.",                                                                                                                   knob: null      },
      btn_trim:  { label: "Buttons — Voice Trims",           desc: "Micro adjustment to pitch of voices 1, 2, and 3.",                                                                                                                        knob: null      },
      btn_keys:  { label: "Buttons — Chromatic Keys",        desc: "1-octave chromatic pitch controller.",                                                                                                                                     knob: null      },
    };

    const KR = 8;

    const affects = {
      adsr_atk:   ["FILTER", "VOICE"],
      adsr_dec:   ["FILTER", "VOICE"],
      adsr_sus:   ["FILTER", "VOICE"],
      adsr_rel:   ["FILTER", "VOICE"],
      filt_env:   ["ADSR"],
      v_env:      ["ADSR"],
      flut_rate:  ["VOICE", "FILTER"],
      flut_filt:  ["FILTER"],
      v_flut:     ["FLUTTER"],
      v_port:     ["DRIFT"],
      drift_en:   ["VOICE"],
      drift_rng:  ["VOICE"],
      drift_ctr:  ["VOICE"],
      drift_mode: ["VOICE"],
      fx_eq:      ["FILTER"],
      util_exp:   ["ADSR", "VOICE", "FLUTTER", "FILTER"],
    };

    function Knob({ id, cx, cy, label, active, onClick, bipolar, biDir }) {
      const c = active ? amber : tealLight;
      const r = KR - 2;
      let tipX, tipY;
      if (bipolar) {
        if (active) {
          tipX = cx + biDir * 0.866 * r;
          tipY = cy - 0.5 * r;
        } else {
          tipX = cx;
          tipY = cy - r;
        }
      } else {
        tipX = active ? cx - r       : cx - 0.5 * r;
        tipY = active ? cy           : cy + 0.866 * r;
      }
      return (
        <g onClick={() => onClick(id)} style={{ cursor: "pointer" }}>
          <circle cx={cx} cy={cy} r={KR + 7} fill="transparent" />
          <circle cx={cx} cy={cy} r={KR} fill="#0d2a2a" stroke={c} strokeWidth={active ? 2 : 1.2} />
          <line x1={cx} y1={cy} x2={tipX} y2={tipY} stroke={cream} strokeWidth={1.5} strokeLinecap="round" />
          {label && (
            <text x={cx} y={cy + KR + 8} textAnchor="middle"
              fill={active ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function Toggle({ id, cx, cy, label, active, onClick }) {
      return (
        <g onClick={() => onClick(id)} style={{ cursor: "pointer" }}>
          <rect x={cx - 9} y={cy - 14} width={18} height={28} fill="transparent" />
          <rect x={cx - 5} y={cy - 10} width={10} height={20} rx={3}
            fill="#071010" stroke={active ? amber : tealLight} strokeWidth={active ? 2 : 1.2} />
          <circle cx={cx} cy={active ? cy - 4 : cy + 4} r={3.5}
            fill={active ? amber : tealLight} opacity={0.9} />
          {label && (
            <text x={cx} y={cy + 16} textAnchor="middle"
              fill={active ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function SqBtn({ id, cx, cy, w = 18, h = 18, label, active, onClick }) {
      return (
        <g onClick={() => onClick(id)} style={{ cursor: "pointer" }}>
          <rect x={cx - w/2 - 5} y={cy - h/2 - 5} width={w + 10} height={h + 10} fill="transparent" />
          <rect x={cx - w/2} y={cy - h/2} width={w} height={h} rx={3}
            fill={active ? tealDark : "#071010"} stroke={active ? amber : tealLight}
            strokeWidth={active ? 2 : 1.2} />
          {label && (
            <text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle"
              fill={active ? amber : cream} fontSize={6.5} fontWeight="bold" fontFamily="monospace">{label}</text>
          )}
        </g>
      );
    }

    function PanelBox({ x, y, w, h, label, highlight }) {
      return (
        <g>
          <rect x={x} y={y} width={w} height={h} rx={5}
            fill="rgba(13,42,42,0.65)" stroke="rgba(42,157,143,0.3)" strokeWidth={1} />
          {highlight && (
            <rect x={x} y={y} width={w} height={h} rx={5}
              fill="rgba(233,196,106,0.07)" stroke="rgba(233,196,106,0.55)" strokeWidth={1.5} />
          )}
          {label && (
            <text x={x + w / 2} y={y + 9} textAnchor="middle"
              fill={amber} fontSize={6} fontFamily="monospace" letterSpacing={0.8}>{label}</text>
          )}
        </g>
      );
    }

    const kcy = (y, h) => y + 12 + (h - 12) / 2 - 4;
    const tcy = (y, h) => y + 12 + (h - 12) / 2 - 3;

    function FullPanel({ active, biDir, onClick }) {
      const a  = id => active === id;
      const bi = id => elements[id] && elements[id].knob === "bipolar";
      const K  = (id, cx, cy, lbl) => (
        <Knob key={id} id={id} cx={cx} cy={cy} label={lbl}
          active={a(id)} bipolar={bi(id)} biDir={biDir} onClick={onClick} />
      );
      const lit = new Set(active ? (affects[active] || []) : []);
      const hl  = name => lit.has(name);

      const V_Y = 22, V_H = 108;
      const vCols = [32, 82, 132];
      const vRows = [V_Y+12+16-4, V_Y+12+48-4, V_Y+12+80-4];
      const vKeys = [["v_wvfm","v_mint","v_mwv"],["v_fm","v_env","v_hyp"],["v_port","v_flut","v_vol"]];
      const vLbls = [["WVFM","M-INT\u00b1","M-WV"],["FM","ENV\u00b1","HYP"],["PORT","FLUT","VOL"]];

      const FLT_Y=22,  FLT_H=51,  flt_cy=kcy(22,51);
      const FLD_Y=79,  FLD_H=51,  fld_cy=kcy(79,51);
      const FIL_Y=142, FIL_H=44,  fil_cy=kcy(142,44);
      const ADS_Y=142, ADS_H=44,  ads_cy=fil_cy;
      const DRI_Y=198, DRI_H=52,  dri_cy=kcy(198,52);
      const FX_Y=198,  FX_H=52,   fx_cy=dri_cy;
      const UTL_Y=262, UTL_H=44,  utl_cy=kcy(262,44);

      return (
        <svg width="100%" viewBox="0 0 320 372" style={{ display: "block" }}>
          <rect x={1.5} y={15.5} width={317} height={355} rx={9} fill="#081818" />
          <rect x={1.5} y={15.5} width={317} height={355} rx={9} fill="none" stroke="rgba(42,157,143,0.25)" strokeWidth={1} />

          <PanelBox x={6} y={V_Y} w={152} h={V_H} label="VOICE  \u00d73" highlight={hl("VOICE")} />
          {vKeys.map((row, ri) => row.map((id, ki) => K(id, vCols[ki], vRows[ri], vLbls[ri][ki])))}

          <PanelBox x={164} y={FLT_Y} w={150} h={FLT_H} label="FLUTTER" highlight={hl("FLUTTER")} />
          {K("flut_filt", 201, Math.round(flt_cy), "FILT-MOD")}
          {K("flut_rate", 277, Math.round(flt_cy), "RATE")}

          <PanelBox x={164} y={FLD_Y} w={150} h={FLD_H} label="FOLD" highlight={hl("FOLD")} />
          {K("fold_amt",  182, Math.round(fld_cy), "AMT")}
          {K("fold_lfo1", 220, Math.round(fld_cy), "WF1")}
          {K("fold_lfo2", 258, Math.round(fld_cy), "WF2")}
          {K("fold_lfo3", 296, Math.round(fld_cy), "WF3")}

          <PanelBox x={6} y={FIL_Y} w={152} h={FIL_H} label="FILTER" highlight={hl("FILTER")} />
          {K("filt_env", 25,  Math.round(fil_cy), "ENV\u00b1")}
          {K("filt_q",   63,  Math.round(fil_cy), "Q")}
          {K("filt_cut", 101, Math.round(fil_cy), "CUT")}
          {K("filt_trk", 139, Math.round(fil_cy), "TRK\u00b1")}

          <PanelBox x={164} y={ADS_Y} w={150} h={ADS_H} label="ADSR" highlight={hl("ADSR")} />
          {K("adsr_atk", 183, Math.round(ads_cy), "ATK")}
          {K("adsr_dec", 220, Math.round(ads_cy), "DEC")}
          {K("adsr_sus", 258, Math.round(ads_cy), "SUS")}
          {K("adsr_rel", 295, Math.round(ads_cy), "REL")}

          <PanelBox x={6} y={DRI_Y} w={152} h={DRI_H} label="DRIFT" highlight={hl("DRIFT")} />
          <Toggle id="drift_en"   cx={25}  cy={Math.round(tcy(DRI_Y,DRI_H))} label="EN"   active={a("drift_en")}   onClick={onClick} />
          {K("drift_rng", 63,  Math.round(dri_cy), "RANGE")}
          {K("drift_ctr", 101, Math.round(dri_cy), "CENT\u00b1")}
          <Toggle id="drift_mode" cx={139} cy={Math.round(tcy(DRI_Y,DRI_H))} label="MODE" active={a("drift_mode")} onClick={onClick} />

          <PanelBox x={164} y={FX_Y} w={150} h={FX_H} label="FX" highlight={hl("FX")} />
          {K("fx_eq",    183, Math.round(fx_cy), "EQ\u00b1")}
          {K("fx_drive", 220, Math.round(fx_cy), "DRIVE")}
          {K("fx_dmix",  258, Math.round(fx_cy), "D-MIX")}
          {K("fx_dtime", 295, Math.round(fx_cy), "D-TIME")}

          <PanelBox x={6} y={UTL_Y} w={308} h={UTL_H} label="UTILS" highlight={hl("UTILS")} />
          <g onClick={() => onClick("util_pwr")} style={{ cursor: "pointer" }}>
            <rect x={18} y={Math.round(utl_cy)-9} width={18} height={18} rx={3}
              fill={a("util_pwr") ? tealDark : "#071010"}
              stroke={a("util_pwr") ? amber : "#d04040"} strokeWidth={a("util_pwr") ? 2 : 1.2} />
            <text x={27} y={Math.round(utl_cy)} textAnchor="middle" dominantBaseline="middle"
              fill={a("util_pwr") ? amber : "#d04040"} fontSize={10} fontFamily="monospace">&#x23FB;</text>
            <text x={27} y={Math.round(utl_cy)+15} textAnchor="middle"
              fill={a("util_pwr") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">PWR</text>
          </g>
          {K("util_exp", 160, Math.round(utl_cy), "EXP-SEL")}
          {K("util_vol", 295, Math.round(utl_cy), "M-VOL")}

          <PanelBox x={6} y={318} w={152} h={46} label="LEFT BUTTONBOARD" highlight={hl("LEFT BUTTONBOARD")} />
          <g onClick={() => onClick("btn_light")} style={{ cursor: "pointer" }}>
            <rect x={14} y={334.5} width={13} height={13} rx={2}
              fill={a("btn_light") ? amber : "#071010"}
              stroke={a("btn_light") ? amber : tealLight} strokeWidth={1.2} />
            <text x={20.5} y={354} textAnchor="middle"
              fill={a("btn_light") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">LIGHT</text>
          </g>
          <SqBtn id="btn_oct1" cx={46}  cy={341} w={18} h={18} label="+1" active={a("btn_oct1")} onClick={onClick} />
          <SqBtn id="btn_oct2" cx={68}  cy={341} w={18} h={18} label="+2" active={a("btn_oct2")} onClick={onClick} />
          <SqBtn id="btn_octR" cx={90}  cy={341} w={18} h={18} label="\u2193"  active={a("btn_octR")} onClick={onClick} />
          <g onClick={() => onClick("btn_latch")} style={{ cursor: "pointer" }}>
            <circle cx={114} cy={341} r={KR+5} fill="transparent" />
            <circle cx={114} cy={341} r={KR} fill={a("btn_latch") ? tealDark : "#071010"}
              stroke={a("btn_latch") ? amber : tealLight} strokeWidth={a("btn_latch") ? 2 : 1.2} />
            <text x={114} y={341} textAnchor="middle" dominantBaseline="middle"
              fill={a("btn_latch") ? amber : cream} fontSize={4.5} fontFamily="monospace">LCH</text>
            <text x={114} y={357} textAnchor="middle"
              fill={a("btn_latch") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">LATCH</text>
          </g>
          <g onClick={() => onClick("btn_trim")} style={{ cursor: "pointer" }}>
            <rect x={130} y={330} width={22} height={22} fill="transparent" />
            {[133,141,149].map((tx,i) => (
              <circle key={i} cx={tx} cy={341} r={3.5}
                fill="#071010" stroke={a("btn_trim") ? amber : "#4a8a84"} strokeWidth={1.2} />
            ))}
            <text x={141} y={357} textAnchor="middle"
              fill={a("btn_trim") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">TRIMS</text>
          </g>

          <PanelBox x={164} y={318} w={150} h={46} label="CHROMATIC KEYS" highlight={hl("CHROMATIC KEYS")} />
          <g onClick={() => onClick("btn_keys")} style={{ cursor: "pointer" }}>
            {[0,1,2,3,4,5,6].map(i => (
              <rect key={i} x={180.5+i*17} y={330} width={15} height={24} rx={2}
                fill={a("btn_keys") ? "#c8d8d0" : "#ccc8bc"} stroke="#0a1a1a" strokeWidth={0.8} />
            ))}
            {[0.5,1.5,3.5,4.5,5.5].map((pos,i) => (
              <rect key={i} x={180.5+pos*17+3} y={330} width={11} height={14} rx={2}
                fill={a("btn_keys") ? "#1a6b6b" : "#0d2a2a"}
                stroke={a("btn_keys") ? amber : tealLight} strokeWidth={0.8} />
            ))}
            <text x={239} y={360} textAnchor="middle"
              fill={a("btn_keys") ? amber : "#4a8a84"} fontSize={5} fontFamily="monospace">1 OCT RANGE</text>
          </g>
        </svg>
      );
    }

    function WandertoneGuide() {
      const [active, setActive]     = useState(null);
      const [biDir, setBiDir]       = useState(1);
      const [showFlow, setShowFlow] = useState(false);

      const toggle = id => {
        setShowFlow(false);
        const next = active === id ? null : id;
        if (next && elements[next] && elements[next].knob === "bipolar") {
          setBiDir(Math.random() < 0.5 ? 1 : -1);
        }
        setActive(next);
      };

      const handleBubbleClick = () => {
        setActive(null);
        setShowFlow(prev => !prev);
      };

      const info = active ? elements[active] : null;

      return (
        <div style={{
          background: dark, minHeight: "100vh",
          fontFamily: "'Courier New', monospace", color: cream,
          display: "flex", flexDirection: "column",
          maxWidth: 480, margin: "0 auto",
        }}>
          <div style={{ padding: "8px 14px 8px" }}>
            <span style={{
              fontFamily: "'Franklin Gothic Heavy', 'Arial Narrow', 'Impact', 'Arial Black', sans-serif",
              fontWeight: 900, fontSize: 26, letterSpacing: 2,
              color: cream, textTransform: "uppercase",
            }}>WANDERTONE</span>
          </div>

          <div onClick={handleBubbleClick} style={{
            margin: "14px 10px 0", height: 80,
            background: (info || showFlow) ? tealDark : "rgba(13,42,42,0.35)",
            border: `1px solid ${(info || showFlow) ? amber : "rgba(42,157,143,0.18)"}`,
            borderRadius: 9, padding: "0 10px", boxSizing: "border-box",
            display: "flex", flexDirection: "column", justifyContent: "center",
            transition: "border-color 0.15s, background 0.15s",
            overflow: "hidden", cursor: "pointer",
          }}>
            {showFlow ? (
              <svg width="100%" viewBox="0 0 300 64" style={{ display: "block" }}>
                <text x={150} y={9} textAnchor="middle" fill={amber} fontSize={5.5} fontFamily="monospace" letterSpacing={0.8}>SIGNAL FLOW</text>
                {[
                  { lbl: "VOICES \u00d73", x: 40  },
                  { lbl: "FOLD",           x: 86  },
                  { lbl: "FILTER",         x: 132 },
                  { lbl: "DELAY",          x: 178 },
                  { lbl: "OUT",            x: 224 },
                ].map(({ lbl, x }, i, arr) => (
                  <g key={lbl}>
                    <rect x={x} y={13} width={36} height={14} rx={3} fill="#0a2222" stroke={tealLight} strokeWidth={0.8} />
                    <text x={x+18} y={20} textAnchor="middle" dominantBaseline="middle"
                      fill={cream} fontSize={4.8} fontFamily="monospace">{lbl}</text>
                    {i < arr.length-1 && <>
                      <line x1={x+36} y1={20} x2={x+45} y2={20} stroke={tealLight} strokeWidth={0.8} />
                      <polygon points={`${x+46},20 ${x+43},18.5 ${x+43},21.5`} fill={tealLight} />
                    </>}
                  </g>
                ))}
                <rect x={36} y={38} width={44} height={12} rx={3} fill="#0a2222" stroke="#4a8a84" strokeWidth={0.7} />
                <text x={58} y={44} textAnchor="middle" dominantBaseline="middle" fill="#6ab5af" fontSize={4.5} fontFamily="monospace">FLUTTER / DRIFT</text>
                <line x1={58} y1={38} x2={58} y2={33} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                <line x1={58} y1={33} x2={58} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                <polygon points="58,27 56.5,30 59.5,30" fill="#4a8a84" />
                <line x1={58} y1={33} x2={150} y2={33} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                <line x1={150} y1={33} x2={150} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                <polygon points="150,27 148.5,30 151.5,30" fill="#4a8a84" />
                <rect x={132} y={38} width={36} height={12} rx={3} fill="#0a2222" stroke="#4a8a84" strokeWidth={0.7} />
                <text x={150} y={44} textAnchor="middle" dominantBaseline="middle" fill="#6ab5af" fontSize={4.5} fontFamily="monospace">ADSR ENV</text>
                <line x1={150} y1={38} x2={150} y2={27} stroke="#4a8a84" strokeWidth={0.7} strokeDasharray="2,1.5" />
                <polygon points="150,27 148.5,30 151.5,30" fill="#4a8a84" />
              </svg>
            ) : info ? (
              <>
                <div style={{ color: amber, fontWeight: 700, fontSize: 12, marginBottom: 3, letterSpacing: 0.3 }}>
                  {info.label}
                  {info.knob === "bipolar" && (
                    <span style={{
                      marginLeft: 8, fontSize: 9, fontWeight: 400, color: tealLight,
                      letterSpacing: 0.5, border: `1px solid ${tealLight}`,
                      borderRadius: 3, padding: "1px 4px", verticalAlign: "middle",
                    }}>&plusmn; BIPOLAR</span>
                  )}
                </div>
                <div style={{
                  color: "#a8d5d0", fontSize: 11, lineHeight: 1.45,
                  display: "-webkit-box", WebkitLineClamp: 3,
                  WebkitBoxOrient: "vertical", overflow: "hidden",
                }}>{info.desc}</div>
              </>
            ) : (
              <div style={{ color: "rgba(42,157,143,0.3)", fontSize: 10, letterSpacing: 0.4, textAlign: "center" }}>
                tap any control
              </div>
            )}
          </div>

          <div style={{ padding: "8px 10px 4px" }}>
            <FullPanel active={active} biDir={biDir} onClick={toggle} />
          </div>

          <div style={{
            margin: "4px 10px 16px",
            display: "flex", justifyContent: "center", alignItems: "center", gap: 16,
            fontSize: 9, color: "#4a8a84", fontFamily: "'Courier New', monospace",
          }}>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <svg width={14} height={14} viewBox="0 0 14 14">
                <circle cx={7} cy={7} r={6} fill="#0d2a2a" stroke={tealLight} strokeWidth={1} />
                <line x1={7} y1={7} x2={4.5} y2={10.5} stroke={cream} strokeWidth={1.2} strokeLinecap="round" />
              </svg>
              normal (CCW = off)
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <svg width={14} height={14} viewBox="0 0 14 14">
                <circle cx={7} cy={7} r={6} fill="#0d2a2a" stroke={tealLight} strokeWidth={1} />
                <line x1={7} y1={7} x2={7} y2={2} stroke={cream} strokeWidth={1.2} strokeLinecap="round" />
              </svg>
              &plusmn; bipolar (12 o&apos;clock = off)
            </span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<WandertoneGuide />);
  </script>
</body>
</html>
